# Corre TODA la suite de tests contra un Postgres real de PRUEBA.
#
# Solo a mano (Actions -> Tests contra Postgres -> Run workflow).
# Requiere el secreto TEST_DATABASE_URL (DATABASE_PUBLIC_URL de una base de
# prueba + ?sslmode=require). OJO: los tests BORRAN todas las tablas de esa base.
# Se niega a correr si esa URL es la de produccion (DATABASE_BACKUP_URL).
name: Tests contra Postgres

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-postgres
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Controles de seguridad
        env:
          PRUEBA: ${{ secrets.TEST_DATABASE_URL }}
          PRODUCCION: ${{ secrets.DATABASE_BACKUP_URL }}
        run: |
          set -euo pipefail
          [ -n "${PRUEBA:-}" ] || { echo "::error::Falta el secreto TEST_DATABASE_URL"; exit 1; }
          # Comparar sin el "?sslmode=..." por si una tiene el parametro y la otra no
          if [ "${PRUEBA%%\?*}" = "${PRODUCCION%%\?*}" ]; then
            echo "::error::TEST_DATABASE_URL apunta a la base de PRODUCCION. Los tests la borrarian."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: pytest -q
